name: multi_tenant_saas_billing
description: "A production-grade, multi-tenant SaaS Billing & Analytics Dashboard using Flutter Web."
publish_to: "none"
version: 1.0.2+3


environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Declarative Routing
  go_router: ^14.2.0

  # Charts & Visualization
  fl_chart: ^0.68.0

  # High-Performance Data Grid
  pluto_grid: ^8.0.0

  # PDF Document Generation & In-Browser Printing
  pdf: ^3.10.8
  printing: ^5.13.2

  # Backend & Realtime
  supabase_flutter: ^2.5.6

  # Utilities & UI
  intl: ^0.19.0
  google_fonts: ^6.2.1
  csv: ^6.0.0
  universal_html: ^2.2.4
  http: ^1.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
